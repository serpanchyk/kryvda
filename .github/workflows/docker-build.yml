name: Build deployment images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
concurrency:
  group: kryvda-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv lock --check && uv sync --frozen --all-packages
      - run: uv run pre-commit run --all-files && uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci && npm run lint && npm run test && npm run build
        working-directory: apps/frontend
      - run: kubectl kustomize k8s > /tmp/kryvda.yaml
  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: frontend
            dockerfile: apps/frontend/Dockerfile
          - service: telegram-scraper
            dockerfile: apps/telegram-scraper/Dockerfile
          - service: ai-worker
            dockerfile: apps/ai-worker/Dockerfile
          - service: database
            dockerfile: infra/postgres/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/serpanchyk/kryvda-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  pin:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin all images atomically
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Never overwrite a newer source release with a stale build.
          if ! git diff --quiet "$SOURCE_SHA" HEAD -- apps packages infra scripts pyproject.toml uv.lock .dockerignore .github/workflows/docker-build.yml; then
            echo 'Source changed during build; leave deployment to the newer run.'
            exit 0
          fi
          sed -i -E "s|(ghcr.io/serpanchyk/kryvda-[a-z-]+:)[a-zA-Z0-9_.-]+|\1sha-${SOURCE_SHA}|g" k8s/*.yaml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add k8s
          git diff --cached --quiet || git commit -m "ci: pin deployment images [skip ci]"
          git push origin HEAD:main
