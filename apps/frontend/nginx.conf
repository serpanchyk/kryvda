server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The browser reaches the API through this same origin, so no API address is baked into the
  # build. Registry endpoints are unauthenticated: only reads are exposed publicly; changes are
  # made from the server itself through the loopback-bound API port.
  location /api/ {
    limit_except GET { deny all; }
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
