[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-monitor-gateway"
version = "0.1.0"
description = "Telegram MTProto gateway deployed outside the department firewall."
requires-python = ">=3.12"
# Deliberately free of workspace dependencies: Vercel builds this directory on its own.
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "python-json-logger>=3.2",
    "telethon>=1.40",
    "uvicorn>=0.32",
]

[project.scripts]
telegram-monitor-authorize = "telegram_monitor_gateway.authorize:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_monitor_gateway"]
