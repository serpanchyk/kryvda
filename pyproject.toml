[project]
name = "telegram-monitor"
version = "0.1.0"
description = "Foundation for monitoring an agreed pool of Telegram channels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/telegram-scraper",
    "apps/ai-worker",
    "packages/*",
]

[dependency-groups]
annotation = ["asyncpg>=0.31", "fastapi>=0.115", "uvicorn>=0.34", "jsonschema>=4.23", "python-dotenv>=1"]
dev = [
    "dvc>=3.66",
    "mypy>=1.13",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
mypy_path = [
    "apps/api/src",
    "apps/telegram-scraper/src",
    "apps/ai-worker/src",
    "packages/monitoring-common/src",
]
files = ["apps", "packages", "experiments/annotation-ui/src"]
exclude = ["(^|/)tests/"]

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "experiments/datasets/golden_v0/tests", "experiments/annotation-ui/tests"]
addopts = "-v --import-mode=importlib --cov=apps --cov=packages --cov=experiments/annotation-ui/src --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
pythonpath = [
    "apps/api/src",
    "apps/telegram-scraper/src",
    "apps/ai-worker/src",
    "packages/monitoring-common/src",
    "experiments/datasets/golden_v0/src",
    "experiments/annotation-ui/src",
]

[tool.coverage.run]
data_file = ".pytest_cache/.coverage"
omit = ["*/tests/*", "*__init__.py"]
