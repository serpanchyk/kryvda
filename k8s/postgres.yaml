apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kryvda
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kryvda
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: postgres
        image: ghcr.io/serpanchyk/kryvda-database:sha-9b2c039423338cec6166d13f8d6af035a1790fb0
        env:
        - name: POSTGRES_USER
          value: telegram_monitor
        - name: POSTGRES_DB
          value: telegram_monitor
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kryvda-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - telegram_monitor
            - -d
            - telegram_monitor
            - -h
            - 127.0.0.1
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      nodeSelector:
        kubernetes.io/hostname: mac-master
  serviceName: postgres
