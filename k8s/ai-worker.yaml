apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: kryvda
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: ai-worker
        image: ghcr.io/serpanchyk/kryvda-ai-worker:sha-84df9fe1dd4951133f063703813e376bf252f5eb
        env:
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: kryvda-secret
              key: POSTGRES_DSN
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: kryvda-secret
              key: LITELLM_MASTER_KEY
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
