apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kryvda
  annotations:
    # Incident 2026-11-03: synced before PostgreSQL and migrations so that a broken
    # database cannot block API diagnostics. Restore '2' once the incident is closed.
    argocd.argoproj.io/sync-wave: '-2'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-11-03T18:00:00Z'
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: api
        image: ghcr.io/serpanchyk/kryvda-api:sha-bcc8579890b7682bc0da4dc194d326127992be65
        env:
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: kryvda-secret
              key: POSTGRES_DSN
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8000
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: images
          mountPath: /var/lib/telegram-monitor/channel-images
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: mac-node1
      volumes:
      - name: images
        persistentVolumeClaim:
          claimName: channel-images
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kryvda
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
