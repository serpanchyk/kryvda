[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monitoring-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings[yaml]>=2.6",
    "python-json-logger>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monitoring_common"]
