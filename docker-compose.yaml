# One file for both the department server and local development. `docker compose up -d --build`
# starts the server stack; Telegram is reached through the external gateway at
# TELEGRAM_GATEWAY_URL. Local development adds the gateway itself with COMPOSE_PROFILES=telegram.
# Every setting is documented in .env.example and DEPLOY.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-postgres-dsn: &postgres-dsn postgresql://${POSTGRES_USER:-telegram_monitor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-telegram_monitor}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGHOST: postgres
    volumes:
      - ./infra/postgres:/database:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-telegram_monitor}
      PGUSER: ${POSTGRES_USER:-telegram_monitor}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: ["sh", "/backup.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      POSTGRES_DSN: *postgres-dsn
    # Loopback only: browsers reach the API through the frontend's /api proxy.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - channel-images:/var/lib/telegram-monitor/channel-images:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # Local development only: on the department server Telegram is unreachable, and the same
  # gateway runs on Vercel instead (see docs/deploy/telegram-gateway-vercel.md).
  telegram-gateway:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: apps/telegram-gateway/Dockerfile
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
    restart: unless-stopped
    logging: *default-logging

  telegram-scraper:
    build:
      context: .
      dockerfile: apps/telegram-scraper/Dockerfile
    environment:
      POSTGRES_DSN: *postgres-dsn
      TELEGRAM_GATEWAY_URL: ${TELEGRAM_GATEWAY_URL:?TELEGRAM_GATEWAY_URL must be set in .env}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:?TELEGRAM_GATEWAY_TOKEN must be set in .env}
      COLLECTION_POLL_INTERVAL_SECONDS: ${COLLECTION_POLL_INTERVAL_SECONDS:-3600}
    volumes:
      - channel-images:/var/lib/telegram-monitor/channel-images
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *default-logging

  ai-worker:
    build:
      context: .
      dockerfile: apps/ai-worker/Dockerfile
    environment:
      POSTGRES_DSN: *postgres-dsn
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      ANALYSIS_CLASSIFICATION_CONCURRENCY: ${ANALYSIS_CLASSIFICATION_CONCURRENCY:-1}
      ANALYSIS_ENTITIES_MAX_OUTPUT_TOKENS: ${ANALYSIS_ENTITIES_MAX_OUTPUT_TOKENS:-1024}
      ANALYSIS_CLAIMS_MAX_OUTPUT_TOKENS: ${ANALYSIS_CLAIMS_MAX_OUTPUT_TOKENS:-4096}
      ANALYSIS_CLASSIFICATION_MAX_OUTPUT_TOKENS: ${ANALYSIS_CLASSIFICATION_MAX_OUTPUT_TOKENS:-1024}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  litellm:
    image: docker.litellm.ai/berriai/litellm@sha256:7c311546c25e7bb6e8cafede9fcd3d0d622ac636b5c9418befaa32e85dfb0186
    command: ["--config", "/app/config.yaml"]
    environment:
      LAPATHONIIA_API_BASE: ${LAPATHONIIA_API_BASE:-https://api.lapathoniia.top}
      LAPATHONIIA_API_KEY: ${LAPATHONIIA_API_KEY:?LAPATHONIIA_API_KEY must be set in .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  channel-images:
