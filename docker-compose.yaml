services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./infra/postgres/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-telegram_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGHOST: postgres
    volumes:
      - ./infra/postgres:/database:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    command: ["sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-telegram_monitor}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-telegram_monitor}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - channel-images:/var/lib/telegram-monitor/channel-images:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-scraper:
    build:
      context: .
      dockerfile: apps/telegram-scraper/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-telegram_monitor}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-telegram_monitor}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID must be set}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH must be set}
      TELEGRAM_PHONE_NUMBER: ${TELEGRAM_PHONE_NUMBER:?TELEGRAM_PHONE_NUMBER must be set}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:?TELEGRAM_SESSION_STRING must be set}
      COLLECTION_POLL_INTERVAL_SECONDS: ${COLLECTION_POLL_INTERVAL_SECONDS:-300}
    restart: unless-stopped
    volumes:
      - channel-images:/var/lib/telegram-monitor/channel-images
    depends_on:
      migrate:
        condition: service_completed_successfully

  ai-worker:
    build:
      context: .
      dockerfile: apps/ai-worker/Dockerfile
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-telegram_monitor}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-telegram_monitor}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-1}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-1}
      ANALYSIS_CLASSIFICATION_CONCURRENCY: ${ANALYSIS_CLASSIFICATION_CONCURRENCY:-1}
      ANALYSIS_ENTITIES_MAX_OUTPUT_TOKENS: ${ANALYSIS_ENTITIES_MAX_OUTPUT_TOKENS:-1024}
      ANALYSIS_CLAIMS_MAX_OUTPUT_TOKENS: ${ANALYSIS_CLAIMS_MAX_OUTPUT_TOKENS:-4096}
      ANALYSIS_CLASSIFICATION_MAX_OUTPUT_TOKENS: ${ANALYSIS_CLASSIFICATION_MAX_OUTPUT_TOKENS:-1024}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm@sha256:7c311546c25e7bb6e8cafede9fcd3d0d622ac636b5c9418befaa32e85dfb0186
    command: ["--config", "/app/config.yaml"]
    environment:
      LAPATHONIIA_API_BASE: ${LAPATHONIIA_API_BASE:-https://api.lapathoniia.top}
      LAPATHONIIA_API_KEY: ${LAPATHONIIA_API_KEY:?LAPATHONIIA_API_KEY must be set}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  channel-images:
